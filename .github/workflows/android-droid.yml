# Builds the VibeSkua Android app (Skua.App.Droid) and uploads the APKs.
#
# Uses the same explicit toolchain as build/android/README.md (verified locally): .NET SDK 10.0.1xx with the
# android workload, OpenJDK 21, and the Android SDK installed by build/android/setup-android-sdk.sh (not the
# workload's InstallAndroidDependencies).
#
# Signing: by default the APKs are signed with the auto-generated debug key (sideloading only). For a release
# signature add these repository secrets; nothing else changes:
#   DROID_KEYSTORE_BASE64     base64 of the .jks/.keystore file (base64 -w0 my.keystore)
#   DROID_KEY_ALIAS           key alias in it
#   DROID_KEYSTORE_PASSWORD   store password
#   DROID_KEY_PASSWORD        key password
# The keystore is written to the runner's temp directory and deleted at the end; passwords reach MSBuild only
# through environment variables (AndroidSigningStorePass/KeyPass use env:), never on the command line.
name: Android app

on:
  push:
    paths:
      - 'Skua.App.Droid/**'
      - 'Skua.Core/**'
      - 'Skua.Core.*/**'
      - 'Skua.Compat.WinForms/**'
      - 'build/android/**'
      - '.github/workflows/android-droid.yml'
  pull_request:
    paths:
      - 'Skua.App.Droid/**'
      - 'Skua.Core/**'
      - 'Skua.Core.*/**'
      - 'Skua.Compat.WinForms/**'
      - 'build/android/**'
      - '.github/workflows/android-droid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: ${{ github.workspace }}/../android-sdk
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'

      - name: Install the .NET android workload
        run: dotnet workload install android

      - name: Install the Android SDK (platform 36, build-tools 36.0.0)
        run: bash build/android/setup-android-sdk.sh

      - name: Prepare optional release keystore
        env:
          DROID_KEYSTORE_BASE64: ${{ secrets.DROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DROID_KEYSTORE_BASE64" ]; then
            echo "$DROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/droid.keystore"
            echo "DROID_KEYSTORE=$RUNNER_TEMP/droid.keystore" >> "$GITHUB_ENV"
            echo "Release signing enabled."
          else
            echo "No DROID_KEYSTORE_BASE64 secret: APKs are signed with the debug key."
          fi

      - name: Test, build Debug and Release APKs
        env:
          DROID_KEY_ALIAS: ${{ secrets.DROID_KEY_ALIAS }}
          DROID_KEYSTORE_PASSWORD: ${{ secrets.DROID_KEYSTORE_PASSWORD }}
          DROID_KEY_PASSWORD: ${{ secrets.DROID_KEY_PASSWORD }}
        run: bash Skua.App.Droid/build-droid.sh "${{ runner.temp }}/apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/droid.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: vibeskua-android-apks
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
